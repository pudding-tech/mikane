<mat-list-item class="wrapper" (click)="gotoExpense()">
	<mat-icon matListItemIcon class="expense-icon">{{ expense().categoryInfo?.icon ?? "shopping_cart" }}</mat-icon>
	<div class="price-category">
		<span class="amount-color-darker">{{ expense().amount | appCurrency: expense().eventInfo.currency }}</span>
		<span class="category"> / {{ expense().categoryInfo?.name }} </span>
	</div>
	<div class="title">
		{{ expense().name }}
	</div>
	<div class="payer">
		@if (expense().payer?.avatarURL) {
			<img [ngSrc]="expense().payer?.avatarURL" width="16" height="16" alt="User avatar" class="payer-avatar" />
		}
		<span class="payer-name">
			{{ expense().payer?.name }}
		</span>
	</div>
</mat-list-item>
