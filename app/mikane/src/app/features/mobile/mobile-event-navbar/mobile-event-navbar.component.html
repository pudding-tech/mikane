<div class="navbar" [class.iOS-PWA]="contextService.isIosPwaStandalone">
	@for (link of mobileLinks(); track link.location) {
		<a
			class="nav-button"
			[routerLink]="link.location"
			(click)="activeLink.set(link.location)"
			[class]="{ active: activeLink().includes(link.location), 'nav-back-button': link.location === '/events' }"
			matRipple
		>
			<mat-icon [class.back-icon]="link.location === '/events'">{{ link.icon }}</mat-icon>
			<div>{{ link.name }}</div>
		</a>
	}
</div>
